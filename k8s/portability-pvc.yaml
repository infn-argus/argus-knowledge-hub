# Portable exports and imports (docs/operations.md, "Portable exports").
#
# portability-work       working area: exports/, quarantine/, staging/, evidence/, work/, drills/.
#                        Retention cleanup empties it after 90 days; it need not be backed up.
# portability-artifacts  the content-addressed artifact store (data chunks and blobs that do not go
#                        into Git). Accepted as the initial store ONLY because it is backed up:
#                        include this volume in the cluster's backup, and keep it as long as the Git
#                        history that references it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portability-work
  namespace: assetmanagement
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portability-artifacts
  namespace: assetmanagement
  labels:
    backup: required
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
