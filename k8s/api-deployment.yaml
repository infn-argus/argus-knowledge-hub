apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetmanagement-api
  namespace: assetmanagement
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: assetmanagement-api
  template:
    metadata:
      labels:
        app: assetmanagement-api
    spec:
      containers:
        - name: api
          image: ghcr.io/infn-argus/argus-knowledge-hub-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: database-url
            - name: TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: token-pepper
            - name: IMPORT_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: import-secrets-key
            - name: ATTACHMENTS_DIR
              value: /data/attachments
            # OIDC token verification (Firebase now, swappable to Keycloak later
            # by changing just these three values — see backend/app/auth_oidc.py).
            - name: OIDC_ISSUER
              value: https://securetoken.google.com/seraphic-camera-479521-s5
            - name: OIDC_JWKS_URI
              value: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
            - name: OIDC_AUDIENCE
              value: seraphic-camera-479521-s5
            # Portable exports and imports: settings in the ConfigMap, secrets from Secrets.
            - name: ARGUS_PORTABILITY_PSEUDONYM_SALT
              valueFrom:
                secretKeyRef:
                  name: argus-portability
                  key: pseudonym-salt
                  optional: true
            # The dedicated importer role (CREATEDB, owns only argus_stage_* databases).
            - name: ARGUS_PORTABILITY_STAGING_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: portability-staging-url
                  optional: true
          envFrom:
            - configMapRef:
                name: argus-portability-config
                optional: true
          volumeMounts:
            - name: attachments-data
              mountPath: /data/attachments
            - name: portability-work
              mountPath: /data/portability
            - name: portability-artifacts
              mountPath: /data/portability-artifacts
            - name: portability-secrets
              mountPath: /etc/argus/portability
              readOnly: true
            - name: portability-decryption
              mountPath: /etc/argus/portability-decryption
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: attachments-data
          persistentVolumeClaim:
            claimName: attachments-data
        - name: portability-work
          persistentVolumeClaim:
            claimName: portability-work
        - name: portability-artifacts
          persistentVolumeClaim:
            claimName: portability-artifacts
        - name: portability-secrets
          secret:
            secretName: argus-portability
            defaultMode: 0400
            optional: true
        # Present only while an encrypted archive is being imported (create, import, delete).
        - name: portability-decryption
          secret:
            secretName: argus-portability-decryption
            defaultMode: 0400
            optional: true
