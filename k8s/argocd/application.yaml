# Argo CD runs the hub from the Helm chart in charts/argus-knowledge-hub, with values-production.yaml, as
# main says. The release workflow (.github/workflows/release.yml) sets the image tags there when a version
# tag passes its tests, so a tag is a deployment.
#
# Apply once:  kubectl --kubeconfig ~/kubeconfigs/cloud-config.txt apply -f k8s/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argus-knowledge-hub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/infn-argus/argus-knowledge-hub.git
    targetRevision: main
    path: charts/argus-knowledge-hub
    helm:
      releaseName: argus
      valueFiles: [values-production.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: argus
  syncPolicy:
    automated:
      # Never delete what the chart stops naming (the volumes hold the database and attachments).
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
