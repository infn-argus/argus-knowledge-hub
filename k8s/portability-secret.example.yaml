# TEMPLATE ONLY: never commit real values, and never apply this file as it is.
# It shows the keys the portability Secrets hold. Create the real Secrets from files with
# `kubectl create secret generic … --from-file` (k8s/README.md, "Portable exports").
#
# Rotation (yearly, and at once on suspected compromise): replace the key in the Secret, restart
# the API, run one export and the restore drill; see docs/operations.md, "Key management".
apiVersion: v1
kind: Secret
metadata:
  name: argus-portability
  namespace: assetmanagement
type: Opaque
stringData:
  # Ed25519 signing key (OpenSSH format): ssh-keygen -t ed25519 -N '' -C argus-portability -f signing_key
  signing_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_ME
    -----END OPENSSH PRIVATE KEY-----
  # Keys this instance trusts when importing, one allowed-signers line each:
  # argus-portability namespaces="git,argus-archive" ssh-ed25519 AAAA…
  allowed_signers: |
    REPLACE_ME
  # Deploy key of the `escrow` repository (write access on exporting instances, read-only on importing ones).
  deploy-key-escrow: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_ME
    -----END OPENSSH PRIVATE KEY-----
  # The Git server's host key: ssh-keyscan git.example.org (verify the fingerprint out of band).
  known_hosts: |
    REPLACE_ME
  # Institutional salt of the pseudonymized identity profile (read as an environment variable).
  pseudonym-salt: REPLACE_ME
  # Public recipient lines of a restricted destination (from `python -m app.portability recipient-key`).
  # recipients-escrow-restricted: |
  #   REPLACE_ME
---
# Recipient PRIVATE keys: created only for the duration of an import of an encrypted archive, then
# deleted. The API mounts it as optional, so the files appear (within about a minute) when it is
# created and disappear when it is deleted, without a restart.
apiVersion: v1
kind: Secret
metadata:
  name: argus-portability-decryption
  namespace: assetmanagement
type: Opaque
stringData:
  escrow-officer: |
    REPLACE_ME
