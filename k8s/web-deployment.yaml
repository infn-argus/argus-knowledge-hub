apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetmanagement-web
  namespace: assetmanagement
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: assetmanagement-web
  template:
    metadata:
      labels:
        app: assetmanagement-web
    spec:
      containers:
        - name: web
          image: ghcr.io/amichelotti/assetmanagement-web:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
