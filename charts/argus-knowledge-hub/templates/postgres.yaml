# Postgres 16 with pgvector (Ask ARGUS's written-knowledge search), as docker-compose.yml runs it. The first
# start also makes Keycloak's database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-postgres-init
  labels: {{- include "argus.labels" . | nindent 4 }}
data:
  10-keycloak.sql: |
    CREATE DATABASE keycloak;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argus-postgres-data
  labels: {{- include "argus.labels" . | nindent 4 }}
  annotations:
    # The database: never removed with the chart.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.postgres.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argus-postgres
  labels: {{- include "argus.labels" . | nindent 4 }}
    app: argus-postgres
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: argus-postgres}
  template:
    metadata:
      labels: {app: argus-postgres}
    spec:
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.images.postgres }}
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
            {{- include "argus.secretEnv" (dict "name" "POSTGRES_PASSWORD" "secret" .Values.existingSecret "key" "postgres-password") | nindent 12 }}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: argus-postgres-data}
        - name: init
          configMap: {name: argus-postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: argus-postgres
  labels: {{- include "argus.labels" . | nindent 4 }}
spec:
  selector: {app: argus-postgres}
  ports: [{port: 5432, targetPort: 5432}]
