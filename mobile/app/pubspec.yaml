name: argus_field
description: "ARGUS Field: the field client of the ARGUS knowledge hub."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  argus_api:
    path: ../packages/argus_api
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http: ^1.2.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
