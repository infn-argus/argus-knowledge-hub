server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The built scripts and styles carry a hash in their names: a new release has new names, so these never
    # change and can be kept for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself is checked on every visit (a 304 when unchanged), so a release is seen at once
    # rather than whenever the browser's own guess expires.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
